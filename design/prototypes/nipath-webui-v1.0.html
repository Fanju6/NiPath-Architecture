function proxies(){let g=state.groups.find(x=>x.tag===state.activeGroup)||state.groups[0];let isLB=g.kind==='load-balance',isAuto=g.kind==='urltest';return `${header('代理','策略组直接来自 sing-box JSON · 实时数据由引擎提供',`${btn('全部测速','test-all','hide-small','activity')}${btn('新建策略组','new-group','primary','plus')}`,'PROXY GROUPS')}<div class="proxy-layout ${state.mobileDetail?'mobile-detail':''}"><div class="proxy-list"><div class="filterbar" style="margin-bottom:2px"><span style="font-weight:750;font-size:13px">策略组 <span style="color:#a2afbf;font-weight:500">${state.groups.length}</span></span>${pill('JSON 驱动','blue')}</div>${state.groups.map(group=>`<button class="group-card ${group.tag===g.tag?'active':''}" data-group="${esc(group.tag)}"><div class="group-card-head"><div class="group-avatar ${group.kind==='urltest'?'orange':group.kind==='load-balance'?'purple':''}">${ico(groupIcon(group.kind),20)}</div><div style="flex:1"><div class="group-name">${esc(group.name)}</div><div class="group-sub">${esc(group.desc)}</div></div>${ico('chevron',16)}</div><div class="group-info"><span>${group.members.length} 个候选</span><strong>${group.selected?esc(group.selected):'按连接分配'}</strong>${group.latency?pill(group.latency+' ms','green'):pill('动态', 'amber')}</div></button>`).join('')}</div><section class="card detail"><button class="btn tiny mobileback" style="display:none" data-act="back-groups">← 返回策略组</button><div class="detail-title"><div><h2>${esc(g.name)}</h2><div class="detail-desc">${esc(g.desc)} · 配置 tag: ${esc(g.tag)}</div></div><div class="headerbuttons" style="padding:0">${btn('编辑','edit-group','tiny','edit')}${btn('测速','test-group','tiny','activity')}</div></div><div class="detail-metrics"><div class="metricbox"><span>候选成员</span><strong>${g.members.length} 个</strong></div><div class="metricbox"><span>${isLB?'分配策略':isAuto?'自动选择':'当前选择'}</span><strong style="font-size:${g.selected&&g.selected.length>5?'11px':'15px'}">${isLB?'轮询':esc(g.selected||'—')}</strong></div><div class="metricbox"><span>引擎状态</span><strong style="font-size:13px;color:${state.running?'#149f7a':'#e15e6d'}">${state.running?'运行中':'未运行'}</strong></div></div><div class="twohead"><strong style="font-size:13px">成员列表</strong>${pill(g.source,'blue')}</div><div style="margin:12px 0 7px" class="search">${ico('search',16)}<input id="search-group" placeholder="搜索成员 / 来源 / 协议" value="${esc(state.search)}" autocomplete="off"></div><div class="node-list">${g.members.filter(n=>n.toLowerCase().includes(state.search.toLowerCase())).map((name,i)=>{const selected=name===g.selected;const d=state.nodes.find(n=>n.name===name);return `<div class="node" data-select-node="${esc(name)}"><span class="radio-circle ${selected?'selected':''}" style="opacity:${isLB||isAuto?'.25':'1'}"></span><div class="node-avatar">${name.includes('🇭🇰')?'🇭🇰':name.includes('🇺🇸')?'🇺🇸':name.includes('🇯🇵')?'🇯🇵':name.includes('🇸🇬')?'🇸🇬':'◈'}</div><div class="node-info"><div class="node-name">${esc(name)}</div><div class="rowsub">${d?esc(d.src+' · '+d.protocol):'嵌套策略组'}</div></div>${d?`<span class="latency ${d.ms>200?'warn':''}">${d.ms} ms</span>`:pill('Group','blue')}</div>`}).join('')||`<div class="empty">没有匹配的成员</div>`}</div><div class="mode-notice">${ico('info',14)} ${isLB?'负载均衡按每条连接分配出口，不存在单一全局选中节点。':isAuto?'URLTest 自动选择，TCP 与 UDP 的实际出口可能不同；点击“测速”后须等待结果事件。':state.running?'点击成员调用 Core → sing-box Selector API；界面需收到确认后才算成功。':'核心未运行；可编辑配置，但无法进行运行时节点切换。'}</div></section></div>`}
function sources(){const selected=state.resourceTab;let body='';if(selected==='subscriptions'){body=`<div class="filterbar"><div class="filtergroup">${pill('3 个订阅','blue')} ${pill('78 个节点')} ${pill('1 个待核实','amber')}</div>${btn('更新全部','refresh-all','tiny','refresh')}</div>${state.sources.map(src=>`<section class="card source-card"><div class="source-icon">${ico('link',20)}</div><div><div class="source-title">${esc(src.name)} ${src.status==='applied'?pill('已生效','green'):pill('状态待核实','amber')}</div><div class="source-sub">${esc(src.subtitle)}　·　${src.count} 个节点</div><div class="progress"><div style="width:${Math.min(100,Math.round(src.used/src.total*100))}%"></div></div><div class="source-foot">流量 ${src.used} / ${src.total} GB　·　最近刷新 ${esc(src.when)}</div></div><div class="source-actions">${btn('刷新',`refresh-source:${src.id}`,'tiny','refresh')}${btn('详情',`source-detail:${src.id}`,'tiny','chevron')}</div></section>`).join('')}`}else if(selected==='local'){body=`<div class="filterbar"><div class="filtergroup">${pill('手动节点 2 个','blue')}${pill('来自用户输入')}</div>${btn('添加节点','add-local','tiny','plus')}</div>${['自建节点 · VLESS','测试节点 · Shadowsocks'].map((x,i)=>`<section class="card source-card"><div class="source-icon">${ico('server',19)}</div><div><div class="source-title">${x} ${pill('本地','blue')}</div><div class="source-sub">${i?'test.example.org:443':'home.example.org:8443'} · 只存储在 NiPath 资源库</div></div><div class="source-actions">${btn('编辑','edit-local','tiny','edit')}</div></section>`).join('')}`}else{body=`<div class="filterbar"><div style="flex:1;max-width:330px" class="search">${ico('search',16)}<input id="node-search" placeholder="搜索节点名称 / 来源 / 协议" value="${esc(state.search)}"></div><div class="filtergroup">${pill('示例列表','blue')} ${pill('78 个资源')}</div></div><section class="card cardpad">${state.nodes.filter(x=>[x.name,x.src,x.protocol].join(' ').toLowerCase().includes(state.search.toLowerCase())).map(n=>`<div class="node"><div class="node-avatar">${n.name.slice(0,4)} function rules(){return `${header('规则','管理流量匹配条件与出站目标，操作同一份原生 JSON',`${btn('新建规则','new-rule','primary','plus')}`,'ROUTING')}<div class="tabs">${[['routing','路由规则'],['dns','DNS 规则'],['test','匹配测试']].map(([id,n])=>`<button class="tab ${state.ruleTab===id?'active':''}" data-rule-tab="${id}">${n}</button>`).join('')}</div>${state.ruleTab==='routing'?`<div class="grid" style="grid-template-columns:minmax(0,1fr) 270px;gap:16px" id="rule-grid"><div><div class="filterbar"><span class="help">规则按优先级自上而下匹配，最后一条为兜底</span>${pill('配置 #'+state.revision,'blue')}</div>${state.rules.map((r,i)=>`<section class="card rule-card"><div class="rule-top"><span class="rule-prio">${String(i+1).padStart(2,'0')}</span><div style="min-width:0;flex:1"><div class="rule-name">${esc(r.title)}</div><div class="rule-sub">${esc(r.rule)}</div></div><span class="rule-target">${esc(r.target)}</span><span role="switch" aria-checked="${r.enabled}" tabindex="0" class="toggle ${r.enabled?'on':''}" data-toggle-rule="${r.id}" title="切换规则"></span></div></section>`).join('')}</div><section class="card cardpad" style="height:fit-content"><div class="sectiontitle"><h2>规则工作方式</h2>${ico('info',16)}</div><div class="list-row"><div class="rowtitle">① 匹配条件</div>${pill('域名 / IP / 应用')}</div><div class="list-row"><div class="rowtitle">② 按优先级匹配</div>${pill('从上到下')}</div><div class="list-row"><div class="rowtitle">③ 选择目标出口</div>${pill('策略组 / direct')}</div><div class="mode-notice">${ico('info',14)} 本页修改的是原生 JSON 的 route.rules。修改之前必须通过校验和 revision 检查。</div>${btn('编辑原生 JSON','json-editor','tiny','code')}</section></div>`:state.ruleTab==='dns'?`<section class="card cardpad"><div class="sectiontitle"><h2>DNS 解析规则</h2>${btn('新建 DNS 规则','new-rule','tiny','plus')}</div><div class="list-row"><div><div class="rowtitle">国内域名</div><div class="rowsub">rule_set: geosite-cn</div></div>${pill('本地 DNS','blue')}</div><div class="list-row"><div><div class="rowtitle">其他域名</div><div class="rowsub">final</div></div>${pill('代理 DNS','blue')}</div><div class="inline-note" style="margin-top:16px">DNS 规则具体服务配置遵循 sing-box 目标构建的实际 Schema；此处不提供可疑的自动重写。</div></section>`:`<section class="card cardpad"><div class="sectiontitle"><h2>匹配规则预览</h2>${pill('仅静态模拟','amber')}</div><div class="form-row"><label class="form-label">域名或目标 IP</label><input id="rule-test-host" class="field" placeholder="例如 api.openai.com" value="api.openai.com"></div>${btn('执行静态匹配','run-rule-test','primary','search')}<div class="mode-notice">静态匹配演示仅校验当前规则表达式，不能证明 sing-box 实际数据面一定命中此规则。真实引擎命中追踪属于待验证能力。</div><div id="rule-test-result" class="help" style="margin-top:13px"></div></section>`}`}
function settings(){const sec=state.settingsTab;const settingsNav=[['general','通用','settings'],['core','内核与接管','server'],['dns','DNS 与网络','globe'],['config','配置编辑','code'],['security','安全与访问','shield'],['appearance','外观','sun'],['about','关于 NiPath','info']];let body='';if(sec==='general')body=`<h2>通用</h2><div class="help">常用设置与资源同步行为</div>${setrow('启动时恢复上次状态','由后台服务决定，不依赖 WebUI 窗口',true)}${setrow('订阅定时更新','自动检查资源来源的更新计划',true)}${setrow('显示节点延迟','显示来源与观测时间，不把历史值当实时',true)}${setrow('自动更新检查','检测新版本时仅提醒，不自动执行高权限操作',false)}`;if(sec==='core')body=`<h2>内核与接管</h2><div class="help">按当前设备实际能力展示</div>${kvrow('运行宿主','Android Root')}${kvrow('流量接管','eBPF 透明代理')}${kvrow('代理核心','reF1nd sing-box v1.15-alpha')}${kvrow('内核 API','API v6（模拟）')}${kvrow('生效配置','修订 #'+state.revision)}<div class="mode-notice">${ico('shield',14)} Capture 方式由 Host 能力决定；不在界面上显示此平台不支持的操作。</div>${btn('诊断与日志','diag','tiny','activity')}`;if(sec==='dns')body=`<h2>DNS 与网络</h2><div class="help">不会在此建立第二份策略配置</div>${kvrow('DNS 策略','由 sing-box 原生 JSON 定义')}${kvrow('IPv6','按当前宿主能力报告')}${kvrow('网络监听','loopback + 授权访问')}${setrow('自动检测默认网络','支持的平台由 Host 实现',true)}${btn('在 JSON 中查看 DNS','json-editor','tiny','code')}`;if(sec==='config')body=`<h2>原生配置</h2><div class="help">可视化编辑与 JSON 编辑共享 revision</div><div class="mode-notice">${ico('info',14)} 唯一配置文件 · revision ${state.revision}。原型的保存仅更改本地模拟修订号。</div><div class="form-row"><label class="form-label">sing-box JSON 片段（演示）</label><textarea id="json-input" class="field" rows="11" spellcheck="false" style="font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical">${esc(JSON.stringify({outbounds:state.groups.slice(0,2).map(x=>({type:x.kind,tag:x.tag,outbounds:x.members.slice(0,3),...(x.kind==='selector'?{default:'Auto'}:{interval:'3m'})}))},null,2))}</textarea></div><div class="headerbuttons">${btn('JSON 语法检查','validate-json','tiny','check')}${btn('保存模拟修订','save-json','primary','file')}</div>`;if(sec==='security')body=`<h2>安全与访问</h2><div class="help">本地监听不等于自动安全</div>${kvrow('监听地址','127.0.0.1（本机）')}${kvrow('WebUI 鉴权','会话 / CSRF / Host + Origin')}${kvrow('原生 Broker','受限能力清单')}${setrow('允许远程访问','默认关闭，启用前需要配对与 TLS',false)}<div class="inline-note">演示原型无真实认证；正式产品不能把 Core/Root 或 sing-box 密钥暴露到浏览器。</div>`;if(sec==='appearance')body=`<h2>外观</h2><div class="help">桌面/手机同一套界面，只改变响应布局</div>${kvrow('界面风格','NiPath 蓝 · 清爽卡片')}${kvrow('导航','桌面侧栏 / 手机底部栏')}${setrow('紧凑模式','更适合大量节点列表',false)}<div class="setting-row"><div><div class="setting-name">外观主题</div><div class="setting-help">支持明亮与深色</div></div>${btn(state.theme==='dark'?'深色模式':'明亮模式','theme','tiny',state.theme==='dark'?'moon':'sun')}</div>`;if(sec==='about')body=`<h2>NiPath · 奶屁</h2><p style="font-size:13px;color:#92a1b4">简单的连接，完整的控制。</p>${kvrow('目标软件版本','1.0.0')}${kvrow('设计版本','UI Concept 1.0')}${kvrow('架构规范','v1.5')}${kvrow('平台','Android / Windows / Linux')}${btn('访问 GitHub','github','tiny','link')}`;return `${header('设置','平台能力、配置、网络、安全和界面偏好',btn('原生 JSON','json-editor','hide-small','code'),'SETTINGS')}<div class="settings-layout"><section class="card settingsnav">${settingsNav.map(([id,n,ic])=>`<button class="${id===sec?'active':''}" data-settings-tab="${id}">${ico(ic,15)}${n}</button>`).join('')}</section><section class="card settings-content">${body}</section></div>`}
function kvrow(n,v){return `<div class="setting-row"><div><div class="setting-name">${n}</div></div><span style="color:#61718c;font-size:11px;text-align:right">${v}</span></div>`}function setrow(n,desc,on){return `<div class="setting-row"><div><div class="setting-name">${n}</div><div class="setting-help">${desc}</div></div><span class="toggle ${on?'on':''}" data-act="setting-toggle" role="switch" tabindex="0" aria-checked="${on}"></span></div>`}function renderPage(){return {overview,proxies,resources:sources,rules,settings}[state.page]()}function renderDialog(){let title='',intro='',inner='';switch(state.dialog){case 'new-group':title='创建策略组';intro='新策略组会被写入同一份 sing-box JSON（原型本地模拟）';inner=`<div class="form-row"><label class="form-label">策略组名称</label><input id="dialog-name" class="field" value="新建策略组" maxlength="36"></div><div class="form-row"><label class="form-label">类型</label><select id="dialog-type" class="field"><option value="selector">Selector · 手动选择</option><option value="urltest">URLTest · 自动测速</option><option value="load-balance">LoadBalance · 按连接分配</option></select></div><div class="form-row"><label class="form-label">初始成员</label><select id="dialog-member" class="field"><option>🇭🇰 香港 01</option><option>🇺🇸 美国 03</option><option>🇯🇵 日本 02</option></select></div>`;break;case 'import-source':title='导入订阅';intro='添加 URL，由 Core 验证订阅并交给锁定版本的解析器';inner=`<div class="form-row"><label class="form-label">订阅名称</label><input id="dialog-name" class="field" placeholder="例如 我的订阅"></div><div class="form-row"><label class="form-label">订阅 URL</label><input id="dialog-url" class="field" type="url" placeholder="https://example.com/subscription"></div><div class="mode-notice">仅本地演示，不会向 URL 发出网络请求或读取任何凭据。</div>`;break;case 'new-rule':title='创建路由规则';intro='根据条件匹配到某个策略组 / direct；必须经过 sing-box 校验';inner=`<div class="form-row"><label class="form-label">规则名称</label><input id="dialog-name" class="field" value="自定义规则"></div><div class="form-row"><label class="form-label">域名后缀</label><input id="dialog-value" class="field" placeholder="example.com"></div><div class="form-row"><label class="form-label">目标出口</label><select id="dialog-target" class="field">${state.groups.map(x=>`<option>${esc(x.name)}</option>`).join('')}<option>direct</option></select></div>`;break;case 'add-local':title='添加本地节点';intro='在资源页添加一个手动节点，后续由 Provider 提供给策略组';inner=`<div class="form-row"><label class="form-label">节点名称</label><input id="dialog-name" class="field" value="自定义节点"></div><div class="form-row"><label class="form-label">协议</label><select id="dialog-type" class="field"><option>VLESS</option><option>Shadowsocks</option><option>Trojan</option></select></div><div class="form-row"><label class="form-label">服务器域名</label><input id="dialog-value" class="field" value="server.example.com"></div>`;break;case 'edit-group':{const g=state.groups.find(x=>x.tag===state.activeGroup);title='编辑策略组';intro='仅修改当前 JSON 可表示的字段，保留无法可视化表达的配置';inner=`<div class="form-row"><label class="form-label">策略组名称</label><input id="dialog-name" class="field" value="${esc(g.name)}"></div><div class="form-row"><label class="form-label">配置 tag</label><input class="field" value="${esc(g.tag)}" disabled></div><div class="mode-notice">修改显示名为原型交互；正式产品的 tag 变更必须同事务检查所有原生引用。</div>`;break;}default:title='操作说明';intro='NiPath WebUI 交互原型';inner=`<div class="mode-notice">此操作的完整网络/配置行为需要 Go Core API；这里只演示入口和确认流程。</div>`}return `<div class="cover" data-close-overlay="true"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="twohead"><h2>${title}</h2><button class="iconbtn" data-act="close-dialog" title="关闭">${ico('close',18)}</button></div><p class="dialog-intro">${intro}</p>${inner}<div class="dialog-bottom">${btn('取消','close-dialog','')}${btn('确认','submit-dialog','primary','check')}</div></section></div>`}
function render(){document.body.className=state.theme==='dark'?'dark':'';document.getElementById('app').innerHTML=appShell();const gg=document.getElementById('rule-grid');if(gg&&innerWidth<1070)gg.style.gridTemplateColumns='1fr'}
function act(action){if(action==='back-groups'){state.mobileDetail=false;render();return}if(action==='toggle-service'){state.running=!state.running;toast(state.running?'模拟操作：服务已启动':'模拟操作：服务已停止');render();return}if(action==='reload-demo'){toast('已刷新模拟运行状态');return}if(action==='theme'){state.theme=state.theme==='light'?'dark':'light';render();return}if(action==='close-dialog'){state.dialog='';render();return}if(['new-group','import-source','new-rule','add-local','edit-group'].includes(action)){state.dialog=action;render();return}if(action==='submit-dialog'){const v=id=>document.getElementById(id)?.value?.trim()||'';if(state.dialog==='new-group'){let n=v('dialog-name');if(!n){toast('请输入策略组名称');return}let k=v('dialog-type');let id='custom-'+(state.groups.length+1);state.groups.push({tag:id,name:n,kind:k,desc:`${k} · 自定义`,selected:k==='selector'?v('dialog-member'):null,source:'用户配置',members:[v('dialog-member')],latency:null});state.activeGroup=id;state.page='proxies';state.revision++;toast('已在本地原型中创建策略组（未写入实际 JSON）')}else if(state.dialog==='import-source'){const url=v('dialog-url');if(!/^https?:\/\//.test(url)){toast('请输入以 http:// 或 https:// 开头的 URL');return}state.sources.push({id:Date.now(),name:v('dialog-name')||'新订阅',subtitle:url,count:0,when:'待首次刷新',status:'stale',used:0,total:1});state.resourceTab='subscriptions';state.revision++;toast('已添加模拟订阅，未发出网络请求')}else if(state.dialog==='new-rule'){if(!v('dialog-value')){toast('请输入域名后缀');return}state.rules.splice(state.rules.length-1,0,{id:Date.now(),title:v('dialog-name')||'自定义规则',rule:'domain_suffix: '+v('dialog-value'),target:v('dialog-target'),enabled:true});state.ruleTab='routing';state.revision++;toast('已创建模拟规则')}else if(state.dialog==='edit-group'){state.groups.find(x=>x.tag===state.activeGroup).name=v('dialog-name')||'未命名';state.revision++;toast('已保存模拟组名称')}else{toast('操作已在原型中演示（未写入真实 Core）')}state.dialog='';render();return}if(action==='test-all'||action==='test-group'){toast('演示：已提交测速请求；真实应用应等待引擎测速结果事件');return}if(action==='command'){toast('快捷命令：可按 1～5 在五个主页面间切换');return}if(action==='notifications'){toast('演示通知：备用订阅状态需要核实');return}if(action==='refresh-all'){state.sources.forEach(x=>{x.when='刚刚';x.status='applied'});toast('模拟：全部资源已标记刷新；真实应用需校验内核应用结果');render();return}if(action.startsWith('refresh-source:')){const s=state.sources.find(x=>x.id===Number(action.split(':')[1]));s.when='刚刚';s.status='applied';toast('模拟刷新完成；真实状态需引擎确认');render();return}if(action.startsWith('source-detail:')){const s=state.sources.find(x=>x.id===Number(action.split(':')[1]));toast(`${s.name} · ${s.count} 节点 · 状态 ${s.status}`);return}if(action==='json-editor'){state.page='settings';state.settingsTab='config';render();window.scrollTo(0,0);return}if(action==='validate-json'){try{JSON.parse(document.getElementById('json-input').value);toast('JSON 语法正确（尚未执行 sing-box Schema 校验）')}catch(e){toast('JSON 语法错误：'+e.message.slice(0,100))}return}if(action==='save-json'){try{JSON.parse(document.getElementById('json-input').value);state.revision++;toast('本地模拟保存成功，revision 已递增；未触发内核应用');render()}catch(e){toast('无法保存：JSON 语法错误')}return}if(action==='run-rule-test'){const h=document.getElementById('rule-test-host').value.trim();const d=document.getElementById('rule-test-result');d.textContent=!h?'请输入域名':h.endsWith('openai.com')?'静态预览：可能命中「AI 平台」→ AI 服务':'静态预览：未命中演示特殊规则 → Proxy（不代表真实引擎结果）';return}if(action==='setting-toggle'){toast('演示：此设置实际保存需要 Core API');return}if(action==='diag'||action==='connections'||action==='node-refs'||action==='edit-local'||action==='chart-mode'){toast('此入口已预留，完整数据/诊断能力等待 Go Core API 实现');return}if(action==='github'){window.open('https://github.com/Fanju6/NiPath-Architecture','_blank');return}toast('当前为交互原型，无后端操作')}
document.addEventListener('click',e=>{const navbtn=e.target.closest('[data-nav]');if(navbtn){setPage(navbtn.getAttribute('data-nav'));return}const grp=e.target.closest('[data-group]');if(grp){state.activeGroup=grp.getAttribute('data-group');state.mobileDetail=true;state.search='';render();return}const sb=e.target.closest('[data-settings-tab]');if(sb){state.settingsTab=sb.getAttribute('data-settings-tab');render();return}const tb=e.target.closest('[data-resource-tab]');if(tb){state.resourceTab=tb.getAttribute('data-resource-tab');state.search='';render();return}const rb=e.target.closest('[data-rule-tab]');if(rb){state.ruleTab=rb.getAttribute('data-rule-tab');render();return}const t=e.target.closest('[data-toggle-rule]');if(t){const r=state.rules.find(x=>x.id===Number(t.getAttribute('data-toggle-rule')));r.enabled=!r.enabled;state.revision++;render();toast('规则已在本地原型中切换');return}const node=e.target.closest('[data-select-node]');if(node){const g=state.groups.find(x=>x.tag===state.activeGroup);if(!state.running){toast('内核未运行：无法进行实时节点切换');return}if(g.kind!=='selector'){toast('此组由引擎自动或按连接选择，不能按 Selector 操作');return}const n=node.getAttribute('data-select-node');g.selected=n;toast('模拟选择成功：真实实现必须等待 Engine API 确认');render();return}const actbtn=e.target.closest('[data-act]');if(actbtn){act(actbtn.getAttribute('data-act'));return}if(e.target.matches('[data-close-overlay]')){state.dialog='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='search-group'||e.target.id==='node-search'){let value=e.target.value,pos=e.target.selectionStart;state.search=value;render();let t=document.getElementById(e.target.id);if(t){t.focus();t.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toast('快捷命令：按 1～5 快速切换页面');return}if(state.dialog&&e.key==='Escape'){state.dialog='';render();return}if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey&&/^[1-5]$/.test(e.key)){setPage(nav[Number(e.key)-1][0])}});
const url=new URL(location.href);const from=url.searchParams.get('page');if(nav.some(([id])=>id===from))state.page=from;const tt0=url.searchParams.get('theme');if(tt0==='dark')state.theme='dark';render();
</script>
