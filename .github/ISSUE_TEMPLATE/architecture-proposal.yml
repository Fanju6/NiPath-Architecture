name: 架构改进建议
description: 提议 NiPath 的产品功能或技术架构变更
title: "[Proposal] "
labels: []
body:
  - type: markdown
    attributes:
      value: "欢迎提交建议。请说明需求、权衡和验证依据；当前仓库主要讨论架构规划。"
  - type: textarea
    id: problem
    attributes:
      label: 问题与背景
      description: 当前设计解决不了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 您建议如何调整 NiPath 1.0？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
  - type: textarea
    id: validation
    attributes:
      label: 验证依据或测试思路
  - type: textarea
    id: impact
    attributes:
      label: 对平台、安全性及维护的影响
