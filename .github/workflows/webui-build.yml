name: Build NiPath WebUI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/webui-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nipath-webui-build
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and publish to docs/
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install packages
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Verify official shadcn/ui component snapshot
        working-directory: web
        run: npm run check:ui
      - name: Build React application
        working-directory: web
        env:
          GITHUB_PAGES: "true"
        run: npm run build
      - name: Install browser for Android and desktop UI checks
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test Android navigation and desktop layout
        working-directory: web
        run: npm run test:e2e
      - name: Upload Android and desktop UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nipath-ui-screenshots
          path: web/test-results/*.png
          if-no-files-found: ignore
      - name: Commit generated website and synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs web/package-lock.json
          if git diff --staged --quiet; then
            echo "No generated changes."
          else
            git commit -m "build(webui): publish Vite application [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
